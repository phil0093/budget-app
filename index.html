<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Budget M&P</title>

    <link rel="ss
</head>

<body>

    <div class="container">

        <h1>Budget M&P</h1>

        <div class="solde-card">
            <div class="titre">
                Reste à dépenser
            </div>

            <div id="resteADepenser" class="montant">
                0,00 €
            </div>
        </div>

        <div class="saisie">
            <h2>Nouvelle dépense</h2>

            <input type="text" id="libelle" placeholder="Libellé">

            <input type="date" id="dateDepense">

            <input type="number"
                   id="montant"
                   step="0.01"
                   placeholder="Montant">

            <button onclick="ajouterDepense()">
                Ajouter
            </button>
        </div>

        <div class="actions">

            <button onclick="afficherDepenses()">
                Toutes les dépenses
            </button>

            <button onclick="afficherRecurrentes()">
                Dépenses récurrentes
            </button>

        </div>

        <div id="contenu"></div>

    </div>

    js/app.jsscript>

</body>
</html>
