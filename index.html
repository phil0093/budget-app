<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget M&P</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Budget M&P</h1>

        <div class="auth-box">

            <div id="userInfo">
                Non connecté
            </div>

            <button id="loginBtn" onclick="loginGoogle()">
                Connexion Google
            </button>

            <button id="logoutBtn"
                    onclick="logout()"
                    style="display:none">
                Déconnexion
            </button>

        </div>

        <div class="solde-card">

            <div class="titre">
                Reste à dépenser
            </div>

            <div id="resteADepenser" class="montant">
                0,00 €
            </div>

        </div>

        <div class="saisie">

            <h2>Nouvelle dépense</h2>

            <input
                type="text"
                id="libelle"
                placeholder="Libellé">

            <input
                type="date"
                id="dateDepense">

            <input
                type="number"
                id="montant"
                step="0.01"
                placeholder="Montant">

            <button onclick="ajouterDepense()">
                Ajouter
            </button>

        </div>

        <div class="actions">

            <button onclick="afficherDepenses()">
                Toutes les dépenses
            </button>

            <button onclick="afficherRecurrentes()">
                Dépenses récurrentes
            </button>

        </div>

        <div id="contenu"></div>

    </div>

    <script type="module" src="js/auth.js"></script>
    <scriptjsscript>

</body>

</html>
