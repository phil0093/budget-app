<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget M&P</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/Image1.png">
</head>

<body>
    <button
        id="menuButton"
        onclick="toggleMenu()">
    
        ☰
    
    </button>

    <div
        id="sidebar"
        class="sidebar">
    
        <button onclick="afficherAccueil()">
            🏠 Accueil
        </button>
    
        <button onclick="afficherBudget()">
            💰 Budget
        </button>
    
        <button onclick="afficherMenus()">
            🍽️ Menus
        </button>
    
        <button onclick="afficherCourses()">
            🛒 Liste de courses
        </button>
    
        <button onclick="afficherTodo()">
            ✅ To Do List
        </button>
    
        <button onclick="afficherCalendrier()">
            📅 Calendrier
        </button>
    
    </div>
    
    <div class="container">

        <h1 class="titre-budget">
            <span class="coeur">❤️</span>
            Budget M&amp;P
            <span class="coeur">❤️</span>
        </h1>

        <div class="auth-box">

            <div id="userInfo">
                Non connecté
            </div>

            <button id="loginBtn" onclick="loginGoogle()">
                Connexion Google
            </button>

            <button id="logoutBtn"
                    onclick="logout()"
                    style="display:none">
                Déconnexion
            </button>

        </div>

        <div id="application" style="display:none;">

            <div id="pageAccueil">
        
                <div class="solde-card">
        
                    <div class="titre">
                        Reste à dépenser
                    </div>
        
                    <div id="resteADepenser" class="montant">
                        0,00 €
                    </div>
        
                </div>
        
                <div class="saisie">
        
                    <h2>Nouvelle dépense</h2>
        
                    <input
                        type="text"
                        id="libelle"
                        placeholder="Libellé">
        
                    <input
                        type="date"
                        id="dateDepense">
        
                    <input
                        type="number"
                        id="montant"
                        step="0.01"
                        placeholder="Montant">
        
                    <button onclick="ajouterDepense()">
                        Ajouter
                    </button>
        
                </div>
        
            </div>
        
            <div id="contenu"></div>
        
        </div>

    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>

</body>

</html>
